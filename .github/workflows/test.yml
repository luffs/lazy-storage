name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm test

  sqlite:
    name: bun:sqlite adapter (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Bun
        # Via Bun's official npm package rather than oven-sh/setup-bun: only
        # GitHub-owned actions are used here
        run: npm install -g bun

      - name: Run the adapter tests
        run: npm run test:bun

  fuzz:
    name: Convergence fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run a longer randomized campaign
        # A random seed each run; a failure prints the seed and a reproduction command
        run: node test/fuzz/run.js --runs 200 --steps 50 --clients 4
