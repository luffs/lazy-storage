name: Publish to npm (Trusted Publishing)

on:
  release:
    types: [published]
  workflow_dispatch: {}

# Required for npm OIDC trusted publishing
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        # The repo keeps a bun.lock; npm resolves the single dependency itself
        run: npm install --no-package-lock

      - name: Run tests
        run: npm test

      - name: Install Bun
        # Via Bun's official npm package rather than oven-sh/setup-bun: only
        # GitHub-owned actions are used here
        run: npm install -g bun

      - name: Run the bun:sqlite adapter tests
        run: npm run test:bun

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm (with provenance)
        # With trusted publishing enabled for this repo in npm, no token is needed.
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          echo "Publishing version $(node -p "require('./package.json').version")"
          npm publish --access public
